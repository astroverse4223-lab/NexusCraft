# Nexus
#
# The spawn is generated by the plugin by default. If you would rather use your
# own build - a town downloaded from a schematic site, say - paste it into the
# `nexus_hub` world with WorldEdit, then:
#
#   1. set custom: true below
#   2. stand where players should land and run  /nexus setspawn
#   3. stand where each NPC should be and run   /nexus setnpc <survival|prison|bedwars|creative>
#
# With custom: true the plugin never generates or touches the build. It only
# places the four NPCs at the positions recorded here.
spawn:
  custom: false

  # Filled in by /nexus setspawn. Ignored while custom is false.
  at: {}

  # Filled in by /nexus setnpc. Any not set default to a spot in the generated
  # plaza, so you can move them one at a time.
  npcs: {}

# The server's own texture pack, offered to players when they join.
#
# It has to be reachable over http from wherever your players are - a GitHub
# release asset, a Dropbox direct link, anything that serves the .zip. The
# server cannot host it for you.
#
# You do NOT set the hash. The file is fetched once at startup and hashed here,
# because a hash that disagrees with the file makes every player re-download the
# pack on every join, and it looks exactly like the pack not working.
resourcePack:
  url: ''
  # true kicks anybody who declines or fails the download. Usually not worth it.
  required: false
  prompt: 'This server has its own textures. Worth saying yes.'

# Custom armour sets the resource pack defines.
#
# Written by the launcher when it builds a pack with armour in it, so the ids
# here are the ids the pack was actually built with. Editing them by hand only
# makes sense if you built the pack somewhere else.
#
#   armoury:
#     emberforged:
#       label: Emberforged
#       base: diamond      # the item prefix, so diamond_helmet and the rest
armoury: {}

# Where those sets turn up on their own.
#
# Both are optional. Left empty, the first set in the armoury is used, so a
# server that has just built its first pack gets working drops without anybody
# configuring anything.
armouryDrops:
  # Given whole to whoever did the most damage to the Warden.
  boss: ''
  # A chance for a legendary crate to carry a set as well as its prize.
  crate: ''
  legendaryChance: 0.125

# A copy of the server's chat, posted into a Discord channel.
#
# This uses a webhook, not a bot - there is no application to create, no token
# to keep secret, and nothing extra running. In Discord: the channel's settings
# -> Integrations -> Webhooks -> New Webhook -> Copy Webhook URL, and paste it
# below. Leave it empty and nothing is sent.
#
# It only goes one way, out of the game. Talking back from Discord into the
# server would need a real bot; this is the direction that matters when the
# people not playing want to see that somebody is.
discord:
  webhook: ''
  chat: true
  joins: true
  events: true

# What chat will not carry.
#
# Everything here refuses the message rather than punishing whoever sent it, so
# a false positive costs somebody one retype rather than a ban. Staff are exempt
# from all of it.
chat:
  # Web addresses. Anything listed under allowedLinks still gets through, which
  # is how you let your own Discord invite past.
  blockLinks: true
  allowedLinks:
    - discord.gg
  # Kept deliberately short. A long list written by somebody else is how a
  # server ends up unable to say "assassin". Repeated letters, punctuation and
  # digits standing in for letters are all seen through already, so each word
  # only needs its plain spelling here.
  blockedWords: []

# Copies of the worlds and the plugin's data, taken on a timer.
#
# Worlds are flushed and frozen before anything is read, so a backup is one
# moment in time rather than a mixture of two - the second kind usually loads,
# which is exactly what makes it dangerous.
#
# They are written to the `backups` folder beside the server jar. Old ones are
# deleted on a count rather than an age, because a disk that fills up silently
# is a server that cannot write its world.
backups:
  enabled: true
  everyMinutes: 120
  keep: 8

# Vote rewards, and the listener the server lists talk to.
#
# This is how a small server is actually found: nobody browses for servers, they
# look at a list, and the lists rank by votes. Add your listing pages under
# `sites` and they show up in /vote.
#
# The listener speaks both Votifier versions on one port. Older lists ask for a
# public key - it is written to plugins/Nexus/votifier/public.key. Newer ones
# ask for a token, which is generated below on first start. `/nexus votekey`
# prints both.
#
# The port has to be reachable from outside, which usually means forwarding it
# the same way the game port is.
voting:
  enabled: true
  port: 8192
  token: ''
  # Paid per vote, multiplied by how many days in a row they have voted, up to
  # seven. Every fifth vote is also a rare key.
  money: 2500
  coins: 25
  sites: []

# The dig site.
digsite:
  # How often the field fills back in, in minutes. A countdown is shown to
  # everybody down there, and anyone still in the hole is moved to the camp
  # before it closes. Only air is filled, so anything built in the pit stays.
  resetMinutes: 30

# How many weeks a season runs before everything resets. The season number and
# its start time are kept as flat keys deliberately: "season" is a number, so
# anything written under it would turn it into a section and take the number
# with it.
seasonWeeks: 6

# The world boss. It rises in the survival world every so many hours, at the
# spot set with /nexus setboss, and everybody who hurts it is paid a share of
# the purse rather than only whoever lands the last hit.
bossEveryHours: 1

cosmetics:
  # Whether hats point at their own model in a resource pack. Off until the
  # textures actually exist: a pack that defines some and not others shows the
  # missing texture for the rest, which looks far worse than a diamond block.
  # Build the pack in the launcher (Mods, Make a pack, Cosmetics) first.
  customModels: false
