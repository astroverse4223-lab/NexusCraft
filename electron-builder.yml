appId: com.nexuscraft.launcher
productName: NexusCraft Launcher
copyright: Copyright © 2026 NexusCraft

directories:
  output: release
  buildResources: build

# Only the compiled output ships; sources and configs stay out of the package.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc}'

  # The speech model is downloaded on demand into the user's data directory and
  # must never be baked into the installer. It lands in node_modules by default
  # if anything ever runs the library from a checkout, and it is ~300MB.
  - '!node_modules/@huggingface/transformers/.cache/**'

  # onnxruntime ships prebuilt binaries for every platform it supports - macOS,
  # Linux, and both Windows architectures - which is 208MB to deliver a 34MB
  # one. This is a Windows x64 build, so the rest is dead weight that would
  # more than double the installer.
  - '!node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v3/win32/arm64/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'

  # minecraft-data ships the data files for every Minecraft version ever
  # released, on both editions. Bedrock accounts for 329MB of the 426MB and this
  # is a Java Edition launcher — mineflayer speaks the Java protocol only, and
  # bedrock-protocol is not a dependency, so none of the per-version data is
  # ever read.
  #
  # Four files in bedrock/common are the exception, and they are not optional:
  # minecraft-data's own index.js and lib/supportsFeature.js require them at the
  # top of the file, before anything has said which edition it wants. Dropping
  # them made `require('minecraft-data')` throw outright — which took the Java
  # data down with it and broke the Discover screen's version matching, the
  # blueprint data version, and the companion bot, all in the packaged build
  # only, because a source run reads the real node_modules. Every one of those
  # callers wrapped the require in a silent catch and reported a plausible
  # wrong answer instead.
  #
  # 156KB to keep. The 329MB saving is entirely in the per-version folders.
  - '!node_modules/minecraft-data/minecraft-data/data/bedrock/**'
  - 'node_modules/minecraft-data/minecraft-data/data/bedrock/common/**'

  # The browser build of the runtime. Synthesis runs in the main process on the
  # node backend; the renderer never loads a model, by design.
  - '!node_modules/onnxruntime-web/dist/**'

# Native modules cannot be loaded from inside an asar archive, so better-sqlite3
# is unpacked next to it. The launcher falls back to its JSON store if the
# module still fails to load on the target machine.
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**/*
  # onnxruntime's binding loads onnxruntime.dll and DirectML.dll from beside
  # itself, and a DLL cannot be loaded out of an asar. Unpacking only the .node
  # would get the binding onto disk and leave it unable to find its own library.
  - node_modules/onnxruntime-node/bin/**

# The tray reads its icon from disk at runtime, so the .ico has to exist as a
# real file next to the app rather than only inside the asar.
extraResources:
  - from: build/icon.ico
    to: icon.ico

  # The mods this launcher ships, so they can be installed into an instance
  # from the Mods screen. Each is built separately from its own folder and
  # copied into resources/; the launcher only ever copies these files, it
  # never compiles anything.
  #
  # Every entry in BUNDLED_MODS needs a line here. Ember went without one for
  # a while and the bug was invisible in development, where the jar is read
  # out of the repo — only a packaged build could tell you the file was not
  # there, and it reported the mod as simply unavailable rather than missing.
  - from: resources/hollow.jar
    to: hollow.jar

  - from: resources/ember.jar
    to: ember.jar

  - from: resources/vigil.jar
    to: vigil.jar

  # The shared voice library. Not a card in the Mods tab — it does nothing on
  # its own — but both companions declare it as a dependency, and Fabric
  # refuses to load a mod whose dependency is missing.
  - from: resources/nexusvoice.jar
    to: nexusvoice.jar

# "Install with NexusCraft" links and server invites.
#
# Kept here for the targets that honour it — macOS, Linux and the Windows Store
# build. The NSIS target ignores `protocols` entirely, so the Windows installer
# registers the scheme through build/installer.nsh instead, and the app claims
# it again at each start so a source build works without installing at all.
protocols:
  - name: NexusCraft
    schemes:
      - nexuscraft

# Bundled runtimes and game files live in the user's data directory, never in
# the install directory, so an uninstall never takes worlds with it.
win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
  # Set to your signing certificate to produce a signed installer. Leaving these
  # unset produces an unsigned build, which SmartScreen will warn about.
  # certificateFile: ./cert.pfx
  # certificatePassword: ${env.CSC_KEY_PASSWORD}

nsis:
  # A guided installer rather than a silent one-click, so users can pick a drive
  # with room for game files.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NexusCraft Launcher
  uninstallDisplayName: NexusCraft Launcher
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Registers nexuscraft:// links, which the NSIS target will not do on its own.
  include: build/installer.nsh

# Portable build: npx electron-builder --win portable
portable:
  artifactName: ${productName}-${version}-Portable.${ext}

# No update feed is configured, so the launcher never checks for updates and
# `initAutoUpdate()` exits quietly. To turn self-updating on, replace this with
# a provider and publish a release — no code changes are needed:
#
#   publish:
#     provider: github
#     owner: your-github-username
#     repo: your-repo-name
#
# then build with `GH_TOKEN=... npx electron-builder --win --publish always`.
publish: null
