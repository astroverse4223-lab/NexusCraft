plugins {
    id 'fabric-loom' version '1.17.20'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Simple Voice Chat's API, which is how a mod puts real audio into the
    // world at an entity's position rather than flat in the player's headphones.
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    /*
     * Compile-only on purpose: Ember works without Simple Voice Chat installed
     * and simply does not speak aloud. Bundling the API would put a second copy
     * on the classpath next to the real mod's.
     */
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_version}"

    /*
     * The shared voice, as a separate mod rather than bundled.
     *
     * compileOnly: NexusCraft Voice is its own jar at runtime and carries the
     * 52MB ONNX Runtime once, for both companions. Embedding it here would put
     * a second native runtime on the same classpath as Hollow's copy, which is
     * an UnsatisfiedLinkError halfway through a sentence.
     *
     * Not `modImplementation` and not remapped, because nothing in the library
     * touches a Minecraft class — it takes a string and gives back samples.
     *
     * Build ../voice first; there is no dependency resolution doing it for you.
     */
    compileOnly files("../voice/build/libs/nexusvoice-${project.nexusvoice_version}.jar")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
