name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs electron-builder's install-app-deps postinstall, which
      # rebuilds better-sqlite3 against Electron's ABI.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

  build:
    name: Packaged build
    runs-on: windows-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unpacked build only. Producing the NSIS installer needs a signing
      # certificate that does not belong in CI secrets for every push.
      - name: Build unpacked
        run: npm run build:dir

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: nexuscraft-unpacked
          path: release/win-unpacked
          retention-days: 7
          if-no-files-found: error
